name: v3 host validation

on:
  push:
    branches: ["v3.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    name: Existing product regression
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libssl-dev python3
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug --parallel 2
      - name: Test
        run: ctest --test-dir build/host --output-on-failure --parallel 2
      - name: Configure without IEC 61850
        run: cmake -S . -B build/host-noiec -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Debug -DUHF_ENABLE_IEC61850=OFF
      - name: Build gateway without IEC 61850
        run: cmake --build build/host-noiec --parallel 2 --target uhf-gatewayd
      - name: Test gateway without IEC 61850
        run: ctest --test-dir build/host-noiec --output-on-failure -R '^(uhf_gatewayd_smoke|uhf_runtime_modbus_rtu_smoke|uhf_v3_gateway_e2e|uhf_iec61850_disabled_smoke)$'
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-product-regression-logs
          path: |
            build/host/Testing/Temporary/
            build/host-noiec/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7

  core:
    name: New v3 core (${{ matrix.mode }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - mode: Debug
            build_type: Debug
            sanitizers: "OFF"
          - mode: Release
            build_type: Release
            sanitizers: "OFF"
          - mode: Sanitizers
            build_type: Debug
            sanitizers: "ON"
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v4
      - name: Configure standalone core
        run: cmake -S src/v3 -B build/v3 -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DUHF_V3_SANITIZERS=${{ matrix.sanitizers }}
      - name: Build
        run: cmake --build build/v3 --parallel 2
      - name: Test
        run: ctest --test-dir build/v3 --output-on-failure
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-core-${{ matrix.mode }}-logs
          path: build/v3/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
