name: v3 host validation

on:
  push:
    branches: ["v3.0"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v3-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Export source and readable requirements for review
        run: |
          mkdir -p review-artifacts
          git archive --format=zip HEAD -o review-artifacts/source.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import xml.etree.ElementTree as ET

          ns = {'w': 'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          out = Path('review-artifacts')
          for source in sorted(Path('docs/spec').rglob('*.docx')):
              with ZipFile(source) as doc:
                  root = ET.fromstring(doc.read('word/document.xml'))
              lines = ['Source: ' + str(source), '']
              for paragraph in root.findall('.//w:body//w:p', ns):
                  text = ''.join(paragraph.itertext()) if False else ''.join(
                      node.text or '' for node in paragraph.findall('.//w:t', ns))
                  if text.strip():
                      lines.append(text)
              (out / (source.stem + '.txt')).write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Upload review inputs
        uses: actions/upload-artifact@v4
        with:
          name: v3-review-inputs
          path: review-artifacts/
          retention-days: 7
      - name: Install host dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake g++ make libssl-dev python3
      - name: Configure
        run: cmake --preset host-debug
      - name: Build
        run: cmake --build --preset host-debug --parallel 2
      - name: Test
        run: ctest --test-dir build/host --output-on-failure --parallel 2
      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v3-host-test-logs
          path: build/host/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 7
